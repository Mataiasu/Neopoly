services:
  - type: web
    name: neopoly
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: neopoly-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
